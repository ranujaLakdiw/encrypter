[package]
name = "huh-encrypter"
version = "0.1.0"
edition = "2021"
publish = false
description = "Huh encrypter: AES + ML-KEM-1024 + LZMA2, as a Leptos page compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes = "0.9"
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
cbc = "0.2"
md-5 = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["sha2"] }
base64 = "0.23"
crc32fast = "1"
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "optimization"] }
ml-kem = "0.3"
rand_core = { version = "0.10", default-features = false }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Blob", "BlobPropertyBag", "ClipboardEvent", "Crypto", "CryptoKey", "CssStyleDeclaration", "DataTransfer",
    "Document", "DomTokenList", "DragEvent", "Element", "Event", "EventTarget", "File", "FileList",
    "FocusOptions", "HtmlButtonElement", "HtmlDialogElement", "HtmlDivElement", "HtmlDocument",
    "HtmlElement", "HtmlImageElement", "HtmlInputElement", "HtmlParagraphElement", "HtmlSpanElement",
    "HtmlTextAreaElement", "MediaQueryList", "MouseEvent", "Navigator", "Node", "Storage",
    "SubmitEvent", "SubtleCrypto", "Url", "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
