<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <!--
        What this page is allowed to load and run: files from this site itself,
        and WebAssembly. No inline script or style, nothing from anyone else's
        server, and nowhere to send anything. It comes first so that it covers
        everything after it. tools/site.sh sends the same policy as a response
        header too (where it can also forbid putting the page in a frame).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; font-src 'self'; img-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Huh encrypter</title>
    <meta name="description" content="Lock messages into huH with a shared password or a post-quantum session. ML-KEM-1024 + AES-256, entirely in your browser.">
    <link rel="stylesheet" href="./font/fonts.css" type="text/css">
    <link rel="stylesheet" href="./style_2.css" type="text/css">
    <link rel="icon" type="image/png" href="./img/logo.png" />
</head>

<body>

    <!--
        The page is a Rust app (src/, built into ./pkg with build.sh): it writes all the
        markup here and runs the crypto. js/boot.js starts it; js/particles.min.js only
        draws the backdrop. Every file is served from this site.
    -->
    <noscript>Huh encrypter needs JavaScript switched on.</noscript>

    <script src="./js/particles.min.js"></script>
    <script type="module" src="./js/boot.js"></script>

</body>

</html>
